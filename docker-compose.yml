version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: safety_postgres
    environment:
      POSTGRES_USER: safety_user
      POSTGRES_PASSWORD: safety_password
      POSTGRES_DB: industrial_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety_user -d industrial_safety"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: safety_backend
    environment:
      - DATABASE_URL=postgresql://safety_user:safety_password@db:5432/industrial_safety
      - DEFAULT_SEED=20261022
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safety_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
